# ============================================
# Default Assistant - Simple .conf Example
# ============================================
# The simplest .conf example using bracket syntax

[agent]
name = "Default Assistant"
version = "1.0.0"
desc = "A general-purpose AI assistant"

[prompt]
system = "You are a friendly AI assistant. Answer questions concisely and accurately."

welcome = "Hello! I am Default Assistant, how can I help you?"

[settings]
temperature = 0.7
max_tokens = 4096
stream = true

[tools]
allow = []

[ui]
icon = "🤖"
color = "#6366F1"
theme = "modern"
