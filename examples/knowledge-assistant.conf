# ============================================
# Knowledge Assistant - Personal Knowledge Agent
# ============================================
# Demonstrates advanced .conf features:
# - Arrays
# - Nested objects
# - Multi-section organization
# - @include directive

[agent]
name = "Knowledge Assistant"
version = "2.0.0"
desc = "Smart Q&A assistant based on personal knowledge base"

[prompt]
system = """
You are a personal knowledge assistant.

Capabilities:
1. Answer questions from your knowledge base
2. Organize and summarize information
3. Provide in-depth analysis and recommendations

Response style:
- Clear and concise
- Structured output
- Cite knowledge sources
"""

welcome = "Hello! I am your personal Knowledge Assistant, how can I help you?"

[settings]
temperature = 0.5
max_tokens = 4096
stream = true

[tools]
# Allowed tool list
allow = ["web_search", "read_file", "summarize"]

[ui]
icon = "📚"
color = "#F59E0B"
theme = "modern"

# Advanced settings
[settings.advanced]
# Nested object example
context_window = 128000
max_history = 50
enable_memory = true

[settings.advanced.rag]
enabled = true
chunk_size = 512
top_k = 5
