# ============================================
# Omni Agent - All-in-One Agent Demo
# ============================================
# Showcases all my-agent features:
# - Brace syntax
# - Multi-model providers
# - Tool system
# - Variable substitution
# - Structured output
# - Chained calls
# ============================================

agent {
    name = "Omni Agent";
    version = "2.0.0";
    desc = "All-in-one AI agent with multi-provider, tool calls, and variable substitution";

    # ---- Prompt Configuration ----
    prompt {
        system = """
You are Omni Agent, a powerful AI assistant.

Capabilities:
1. Multi-language communication
2. File operations (read, write, list files)
3. Web search
4. Command execution
5. Time queries

When you need to use a tool, use the following format:
```tool
{"name": "tool_name", "arguments": {...}}
```

Choose the right tool for the task. If the tool result is insufficient, ask the user for more details.
""";

        welcome = "Hello! I am Omni Agent, supporting search, file operations, command execution and more. How can I help you?";

        # Conversation decorators
        before_reply = "Analyze the user's request and select the most appropriate tool. If no tool is needed, answer directly.";
        after_reply = "Ask the user if they need any further assistance.";
    }

    # ---- Settings ----
    settings {
        # Defaults to OpenAI, override at runtime with --provider
        provider = "openai";
        temperature = 0.5;
        max_tokens = 8192;
        stream = true;

        # Structured output mode (enable with --json)
        # json_mode = true;
    }

    # ---- Tool System ----
    tools {
        # Enabled tools, automatically injected into the system prompt at runtime
        allow = [
            "web_search",
            "read_file",
            "write_file",
            "list_files",
            "execute_command",
            "current_time"
        ];
    }

    # ---- UI Configuration ----
    ui {
        icon = "🦾";
        color = "#8B5CF6";
        theme = "modern";
    }
}
