# ============================================
# Variable Substitution Demo
# ============================================
# Demonstrates ${ENV_VAR} syntax in .conf files
# Usage: OUR_AGENT_NAME="My Agent" our-agent run examples/variable-demo.conf

agent {
    name = "${OUR_AGENT_NAME:-Default Agent}";
    version = "1.0.0";
    desc = "Agent configured via environment variables, author: ${USER:-unknown}";

    prompt {
        system = """
You are ${OUR_AGENT_NAME:-Default Agent}, running on ${HOSTNAME:-localhost}.
Today is ${OUR_AGENT_DATE:-everyday}, ready to serve you at any time.
""";
        welcome = "Hello! I am ${OUR_AGENT_NAME:-Default Agent}, current time: ${OUR_AGENT_DATE:-unknown}";
    }

    settings {
        temperature = 0.7;
        max_tokens = 4096;
        stream = true;
    }

    ui {
        icon = "🧩";
        color = "#10B981";
    }
}
