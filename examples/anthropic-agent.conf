# ============================================
# Anthropic Claude Assistant - Multi-Provider Demo
# ============================================
# Demonstrates multi-provider support
# Requires ANTHROPIC_API_KEY environment variable
# Usage: our-agent run examples/anthropic-agent.conf --provider anthropic --key $ANTHROPIC_API_KEY

agent {
    name = "Claude Assistant";
    version = "1.0.0";
    desc = "AI assistant powered by the Anthropic Claude model";

    prompt {
        system = """
You are an AI assistant using the Claude model.
Answer concisely, accurately, and insightfully.
Respond in the user's preferred language.
""";
        welcome = "Hello! I am Claude Assistant, how can I help you?";
    }

    settings {
        # Provider is specified at runtime via --provider anthropic
        temperature = 0.5;
        max_tokens = 4096;
        stream = true;
    }

    ui {
        icon = "🟣";
        color = "#D97706";
        theme = "modern";
    }
}
